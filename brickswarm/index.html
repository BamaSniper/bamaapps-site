<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>BrickSwarm · BamaApps</title>
<link rel="icon" href="../brickswarm-icon.webp">
<style>
:root{--bg:#0B0B0D;--ink:#F4F4F0;--muted:#A6A6AE;--volt:#D4FF3A}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;box-sizing:border-box}
img{width:112px;height:112px;border-radius:24px}
h1{margin:0;font-size:28px;font-weight:900;font-style:italic}
p{margin:0;color:var(--muted);max-width:340px;line-height:1.45}
a.btn{display:inline-block;margin-top:8px;padding:14px 24px;border-radius:999px;background:var(--volt);color:#0B0B0D;font-weight:800;text-decoration:none}
a.home{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
  <img src="../brickswarm-icon.webp" alt="BrickSwarm icon">
  <h1>BrickSwarm</h1>
  <p id="msg">One ball becomes a swarm. Opening Google Play…</p>
  <a class="btn" id="play" href="https://play.google.com/store/apps/details?id=com.bamaapps.brickswarm">Get it on Google Play</a>
  <a class="home" href="../#brickswarm">bamaappsllc.com</a>
</main>
<script>
// Short link for bios and posts: bamaappsllc.com/brickswarm?s=tiktok
// s = source, m = medium (optional). They become the Play Store referrer so Play Console can count installs per link.
(function () {
  var q = new URLSearchParams(location.search);
  var source = (q.get('s') || 'bamaappsllc').replace(/[^\w.-]/g, '').slice(0, 40);
  var medium = (q.get('m') || 'shortlink').replace(/[^\w.-]/g, '').slice(0, 40);
  var ref = 'utm_source=' + source + '&utm_medium=' + medium + '&utm_campaign=brickswarm';
  var url = 'https://play.google.com/store/apps/details?id=com.bamaapps.brickswarm&referrer=' + encodeURIComponent(ref);
  document.getElementById('play').href = url;
  var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios) {
    document.getElementById('msg').textContent = 'BrickSwarm is on Google Play now. The iPhone version is coming soon to the App Store.';
    return;
  }
  location.replace(url);
})();
</script>
</body>
</html>
